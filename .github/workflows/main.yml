name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL to the official TickTick DMG"
        default: "https://download.ticktick.app/download/mac/TickTick_8.2.30_923.dmg"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Patch Script
        env:
          APP_URL: ${{ inputs.app_url || 'https://download.ticktick.app/download/mac/TickTick_8.2.30_923.dmg' }}
        run: |
          chmod +x patch.sh prepare.sh
          ./patch.sh "$APP_URL"

      - name: Package to DMG
        run: |
          PLIST=build/TickTick.patched.app/Contents/Info.plist
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")
          echo "APP_VERSION=${SHORT}_${BUILD}" >> "$GITHUB_ENV"
          hdiutil create -volname "TickTick (Patched)" -srcfolder build/TickTick.patched.app -ov -format UDZO "build/TickTick.patched.${SHORT}_${BUILD}.dmg"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Patched TickTick ${{ env.APP_VERSION }} (${{ github.run_number }} ${{ github.sha }})"
          files: build/TickTick.patched.${{ env.APP_VERSION }}.dmg
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
